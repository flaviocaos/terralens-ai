  const rd360={buracos:[{l:"Buraco",v:solo*0.5},{l:"Trinca",v:co*2000},{l:"Area",v:solo*0.3},{l:"Sev.",v:br<0.3?80:40},{l:"Risco",v:solo*0.6},{l:"Pav.",v:br*80}],postes:[{l:"Cont.",v:en*20},{l:"Altura",v:br*100},{l:"Estado",v:br*70},{l:"Dens.",v:solo*0.5},{l:"Ilum.",v:br*90},{l:"Risco",v:solo*0.3}],placas_auto:[{l:"LPR",v:co*2000},{l:"OCR",v:br*80},{l:"Ang.",v:en*20},{l:"Conf.",v:br*90},{l:"Vel.",v:co*1500},{l:"Det.",v:en*18}],fachadas:[{l:"Estado",v:br*80},{l:"Dano",v:solo*0.5},{l:"Mater.",v:en*20},{l:"Color",v:br*70},{l:"Idade",v:solo*0.4},{l:"Risco",v:solo*0.5}],rachaduras:[{l:"Trinca",v:co*2500},{l:"Larg.",v:co*2000},{l:"Comp.",v:en*25},{l:"Sev.",v:co*2200},{l:"Risco",v:co*2000},{l:"Estab.",v:br*70}],inspecao_predial:[{l:"Dano",v:solo*0.6},{l:"Infiltr.",v:agua*2},{l:"Trinca",v:co*2000},{l:"Pintura",v:br*70},{l:"Estab.",v:br*80},{l:"Sev.",v:solo*0.5}]};
  const radar=mode==="360"?(rd360[id]||rd360.buracos):(rdSat[id]||rdSat.spectral);
  const base={titulo:(mode==="360"?V360:SAT).find(a=>a.id===id)?.label||id,modelo:model,contexto:ctx,imageProfile:ip,lulcClasses:lulcCls,radar,ndvi_hist:js.ndvi_hist,canal_rgb:{r:js.r_hist,g:js.g_hist,b:js.b_hist},classes:lulcCls};
  const interp=mode==="360"?
    `Analise ${(V360.find(a=>a.id===id)||{label:id}).label} em imagem 360°. Contraste espectral ${(co*1000).toFixed(2)}, brilho ${(br*100).toFixed(1)}%, entropia ${en.toFixed(3)}, solo exposto ${solo.toFixed(1)}%. Qualidade de imagem: ${iq}. Para deteccao precisa, use modelo fine-tuned com dataset especifico.${ct}`:
    `Analise ${(SAT.find(a=>a.id===id)||{label:id}).label}. Vegetacao: ${veg.toFixed(1)}%, agua: ${agua.toFixed(1)}%, solo: ${solo.toFixed(1)}%. NDVI proxy=${ndvi.toFixed(3)} (${sv}), GLI=${gli.toFixed(3)}, brilho ${(br*100).toFixed(1)}%, entropia ${en.toFixed(3)}. Variabilidade std=${(js.ndvi_std||0).toFixed(3)}. Qualidade: ${iq}.${ct}`;
  const alertas=mode==="360"?
    [co>0.015?"Alto contraste — possiveis defeitos ou feicoes detectaveis":"Contraste moderado — imagem em condicao razoavel",br<0.2||br>0.8?"Brilho fora do ideal — pode afetar acuracia de deteccao":"Brilho adequado para analise"]:
    [veg<20?"Baixa cobertura vegetal — monitorar degradacao":solo>50?"Alto solo exposto — verificar uso do solo":"Analise concluida — validacao com dados campo recomendada",ndvi<0?"NDVI negativo — area nao vegetada ou urbana densa":"Indices calculados via proxies RGB"];
  const recs=mode==="360"?
    ["Use YOLOv8 fine-tuned com dataset especifico para maxima acuracia","Georreferencie cada deteccao com GPS para inventario espacial","Classifique por severidade para priorizar intervencoes","Integre com sistema de gestao municipal para workflow completo"]:
    ["Use imagens multiespectrais (Sentinel-2/Landsat) para indices reais","Valide resultados com levantamento de campo","Integre dados auxiliares (DEM, precipitacao) para analise completa","Monitore serie temporal para detectar tendencias"];
  const sc=Math.max(0,100-solo*0.3-Math.abs(br-0.5)*50).toFixed(0);
  if(mode==="360")return{...base,interpretacao:interp,alertas,recomendacoes:recs,confianca_deteccao:br>0.3&&br<0.8&&co>0.003?"Alta":br>0.2&&co>0.001?"Media":"Baixa",qualidade_imagem:iq,score_geral:sc};
  if(id==="lulc")return{...base,interpretacao:interp,alertas,recomendacoes:recs,acuracia_estimada:(75+veg*0.1).toFixed(1),kappa_estimado:(0.65+veg*0.001).toFixed(2)};
  if(id==="vigor")return{...base,interpretacao:interp,alertas,recomendacoes:recs,saude_vegetacao:sv,ndvi_medio:ndvi.toFixed(3),estresse_hidrico_pct:Math.max(0,100-veg*1.2).toFixed(1),biomassa_relativa:veg>60?"Alta":veg>30?"Media":"Baixa"};
  if(id==="queimadas")return{...base,interpretacao:interp,alertas,recomendacoes:recs,area_queimada_pct:(solo*0.4).toFixed(1),severidade_dominante:solo>40?"Alta":solo>20?"Media":"Baixa",nbr_estimado:(-ndvi*0.8).toFixed(3),risco_requeimada:solo>30?"Alto":solo>15?"Medio":"Baixo"};
  if(id==="urban")return{...base,interpretacao:interp,alertas,recomendacoes:recs,impermeabilizacao_pct:solo.toFixed(1),risco_ilha_calor:solo>40?"Alto":solo>20?"Medio":"Baixo",vegetacao_urbana_pct:veg.toFixed(1),densidade_construcoes:solo>40?"Alta":solo>20?"Media":"Baixa"};
  if(id==="hidro")return{...base,interpretacao:interp,alertas,recomendacoes:recs,cobertura_hidrica_pct:agua.toFixed(1),risco_inundacao:iR,ndwi_estimado:(agua/100*.6).toFixed(3),qualidade_aparente:agua>20?"Regular":"Boa"};
  if(id==="saneamento")return{...base,interpretacao:interp,alertas,recomendacoes:recs,cobertura_hidrica_pct:agua.toFixed(1),risco_contaminacao:(agua>15&&ndvi<0.05)?"Alto":solo>35?"Medio":"Baixo",turbidez_estimada:agua>20?"Alta":agua>8?"Media":"Baixa",cobertura_sanitaria_est:solo>40?"Deficiente":solo>20?"Parcial":"Adequada"};
  if(id==="floresta")return{...base,interpretacao:interp,alertas,recomendacoes:recs,cobertura_total_pct:veg.toFixed(1),fragmentacao:fR,conectividade:veg>50?"Alta":veg>25?"Media":"Baixa",clareiras_pct:(solo*.3).toFixed(1)};
  if(id==="erosao")return{...base,interpretacao:interp,alertas,recomendacoes:recs,risco_erosivo:eR,solo_exposto_pct:solo.toFixed(1),indice_integridade:(veg/100).toFixed(2),pressao_antropica:solo>40?"Alta":solo>20?"Media":"Baixa"};
  return{...base,interpretacao:interp,alertas,recomendacoes:recs,cobertura_vegetal_pct:veg.toFixed(1),cobertura_hidrica_pct:agua.toFixed(1),solo_exposto_pct:solo.toFixed(1)};
}

            </select>
          </div>
          {analysis&&<div style={{background:`rgba(${is360?"168,85,247":"0,212,255"},.06)`,border:`1px solid rgba(${is360?"168,85,247":"0,212,255"},.3)`,borderRadius:7,padding:"8px 10px"}}><div style={{fontSize:8,color:C.text3,textTransform:"uppercase",marginBottom:2}}>Selecionada</div><div style={{fontSize:12,fontWeight:700}}>{analysis.icon} {analysis.label}</div><div style={{fontSize:9,color:C.text2,marginTop:1}}>{analysis.desc}</div></div>}
          <button onClick={()=>{if(image&&analysis)setShowModal(true);}} disabled={!image||!analysis} style={{width:"100%",background:`linear-gradient(135deg,${is360?C.purple:C.blue},${is360?C.pink:C.cyan})`,color:"#fff",border:"none",padding:11,borderRadius:7,fontSize:12,fontWeight:700,cursor:(!image||!analysis)?"not-allowed":"pointer",opacity:(!image||!analysis)?.4:1}}>
            {!image?"📁 Carregue uma imagem":!analysis?"🎯 Selecione uma analise":"🚀 Gerar Relatorio"}
          </button>
          <button onClick={()=>setPage("landing")} style={{width:"100%",background:"transparent",border:`1px solid ${C.border}`,color:C.text2,padding:7,borderRadius:6,fontSize:11,cursor:"pointer"}}>← Voltar</button>
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.border}`,display:"flex",gap:5,flexWrap:"wrap",background:C.bg2}}>
            {cats.map(c=><button key={c} onClick={()=>setCatF(c)} style={{padding:"3px 10px",borderRadius:18,fontSize:9,fontWeight:700,cursor:"pointer",border:`1px solid ${catF===c?ac:C.border}`,background:catF===c?`${ac}18`:"transparent",color:catF===c?ac:C.text3}}>{c}</button>)}
          </div>
          <div style={{flex:1,padding:13,overflowY:"auto",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:7,alignContent:"start"}}>
            {filtered.map(a=>(
              <Card key={a.id} style={{cursor:"pointer",padding:11,border:`1px solid ${analysis?.id===a.id?ac:C.border}`,background:analysis?.id===a.id?`rgba(${is360?"168,85,247":"0,212,255"},.07)`:C.panel,transition:".15s"}} onClick={()=>setAnalysis(a)}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><div style={{fontSize:17}}>{a.icon}</div>{a.cat&&<span style={{fontSize:7,padding:"1px 5px",borderRadius:7,background:`${ac}15`,color:ac,border:`1px solid ${ac}30`,fontWeight:700}}>{a.cat}</span>}</div>
                <div style={{fontSize:10,fontWeight:700,marginBottom:2}}>{a.label}</div>
                <div style={{fontSize:9,color:C.text2,lineHeight:1.4,marginBottom:5}}>{a.desc}</div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}}>{a.tags.map(t=><Tag key={t} t={t}/>)}{analysis?.id===a.id&&<div style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:ac}}/>}</div>
              </Card>
            ))}
          </div>
        </div>
      </div>
      {showModal&&analysis&&(
        <div onClick={()=>setShowModal(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(6px)"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:13,width:800,maxWidth:"95vw",maxHeight:"88vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"13px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:14,fontWeight:800}}>{analysis.icon} {analysis.label}</div><div style={{fontSize:10,color:C.text2,marginTop:2}}>{is360?"Analise 360°":"Sat/Drone"} · Selecione o modelo</div></div>
              <button onClick={()=>setShowModal(false)} style={{width:25,height:25,borderRadius:5,border:`1px solid ${C.border}`,background:C.panel,color:C.text2,cursor:"pointer",fontSize:12}}>✕</button>
            </div>
            <div style={{overflowY:"auto",padding:"12px 16px",flex:1}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
                {analysis.models.map((m,i)=>{
                  const gc={Baixa:C.green,Media:C.yellow,Alta:C.red,"M.Alta":C.red};
                  return(<div key={m.name} onClick={()=>{setSelIdx(i);setModel(m.name);}} style={{background:C.panel,border:`2px solid ${selIdx===i?C.green:m.rec?ac:C.border}`,borderRadius:10,padding:12,cursor:"pointer",position:"relative"}}>
                    {m.rec&&<div style={{position:"absolute",top:8,right:8,background:`linear-gradient(135deg,${ac},${is360?C.pink:C.blue2})`,color:"#fff",fontSize:8,fontWeight:800,padding:"2px 7px",borderRadius:8}}>✨ Rec.</div>}
                    <div style={{fontSize:13,fontWeight:800,marginBottom:2}}>{m.name}</div>
                    <div style={{fontSize:9,color:C.blue2,fontFamily:"monospace",background:"rgba(59,158,255,.1)",padding:"1px 5px",borderRadius:3,display:"inline-block",marginBottom:6}}>{m.lib}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3,marginBottom:7}}>
                      {[["Compl.",m.compl,gc[m.compl]],["GPU",m.gpu?"Sim":"Nao",m.gpu?C.red:C.green],["Tempo",m.time,""],["Acc.",m.acc,""]].map(([k,v,c])=><div key={k} style={{background:C.bg3,borderRadius:4,padding:"3px 4px"}}><div style={{fontSize:7,color:C.text3,textTransform:"uppercase",marginBottom:1}}>{k}</div><div style={{fontSize:8,fontWeight:600,color:c||C.text}}>{v}</div></div>)}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3}}>
                      <div style={{background:"rgba(0,255,136,.05)",border:"1px solid rgba(0,255,136,.15)",borderRadius:4,padding:"3px 5px",fontSize:8,color:"rgba(0,255,136,.85)",lineHeight:1.4}}>✅ {m.pros}</div>
                      <div style={{background:"rgba(255,77,109,.05)",border:"1px solid rgba(255,77,109,.15)",borderRadius:4,padding:"3px 5px",fontSize:8,color:"rgba(255,77,109,.85)",lineHeight:1.4}}>⚠️ {m.cons}</div>
                    </div>
                  </div>);
                })}
              </div>
            </div>
            <div style={{padding:"10px 16px",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:C.bg}}>
              <div><div style={{fontSize:9,color:C.text3}}>Selecionado:</div><div style={{fontSize:12,fontWeight:700,color:selIdx!==null?C.green:C.text3}}>{selIdx!==null?analysis.models[selIdx].name:"—"}</div></div>
              <div style={{display:"flex",gap:7}}>
                <Btn variant="secondary" onClick={()=>setShowModal(false)}>Cancelar</Btn>
                <Btn onClick={run} disabled={selIdx===null} style={{opacity:selIdx!==null?1:.4,background:`linear-gradient(135deg,${is360?C.purple:C.blue},${is360?C.pink:C.cyan})`}}>📊 Gerar Relatorio</Btn>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
